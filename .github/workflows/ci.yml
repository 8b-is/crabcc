name: CI

# All Linux jobs run on Blacksmith (https://docs.blacksmith.sh). The former
# Hetzner self-hosted pool is gone; the fleet-management workflows that
# supported it (runner-health / runner-gc / provision-*) were deleted along
# with the `disk-guard` composite action, since Blacksmith runners are
# ephemeral Firecracker microVMs with 80-160 GB of scratch disk each.
#
# Blacksmith transparently redirects actions/cache + Swatinem/rust-cache to
# a colocated cache backend (~4x GitHub's throughput), so no cache config
# changes are needed. sccache is deliberately NOT used: per Blacksmith's
# docs it is one of the few backends still routed to GitHub's cross-DC
# cache, which makes it a net loss here.
#
# PR CI is intentionally narrow: lint, plus tests for the crates the PR
# actually touches, plus CLI + MCP smoke. The full matrix runs on push to
# main and on tag (release.yml). PR-time goal is fast feedback, not
# exhaustive coverage.
on:
  push:
    branches: [main]
  pull_request:

# Cancel previous runs on the same ref. When a fixup commit lands on a PR
# before the prior run finishes, the prior run is killed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Linux-only mold linker — slashes link time on debug + ci profiles for
  # this workspace (567 deps). Installed in the `deps` composite step below.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Single source of truth for "what did this PR touch". Previously this
  # block was copy-pasted into the lint and test jobs, which drifted. Both
  # now consume these outputs.
  #
  # Scoped crates are filtered through `cargo metadata --no-deps` so we
  # never emit `-p <name>` for directories under `crates/` that are
  # deliberately excluded from the parent workspace (e.g. crabcc-viz
  # carries its own Cargo.lock and is built standalone). Without the
  # filter, `cargo clippy -p crabcc-viz` errors with "package ID
  # specification did not match any packages".
  scope:
    name: scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      crates: ${{ steps.detect.outputs.crates }}
      smoke: ${{ steps.detect.outputs.smoke }}
      aliases: ${{ steps.detect.outputs.aliases }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR diff (base..head) resolves. Must be a
          # literal 0, not a ternary: `x && 0 || 1` always yields 1 because
          # 0 is falsy in GitHub Actions expressions, leaving a shallow
          # clone where `git diff <base> <head>` dies with "bad object".
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: detect changed scope
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main: belt-and-suspenders, run everything.
            echo "crates=--workspace" >> "$GITHUB_OUTPUT"
            echo "smoke=1"            >> "$GITHUB_OUTPUT"
            echo "aliases=1"          >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; echo "$CHANGED"

          RAW=$(echo "$CHANGED" | awk -F/ '/^crates\// {print $2}' | sort -u)
          MEMBERS=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[].name')
          CRATES=$(echo "$RAW"  | grep -Fxf  <(echo "$MEMBERS") || true)
          DROPPED=$(echo "$RAW" | grep -Fvxf <(echo "$MEMBERS") || true)
          if [ -n "$DROPPED" ]; then
            echo "::notice::Dropped non-workspace crates from scope: $(echo $DROPPED | tr '\n' ' ')"
          fi

          ARGS=""
          for c in $CRATES; do ARGS="$ARGS -p $c"; done
          echo "crates=$ARGS" >> "$GITHUB_OUTPUT"
          if [ -z "$CRATES" ]; then
            echo "::notice::No workspace-crate changes — lint + test will skip"
          else
            echo "::notice::Scope:$ARGS"
          fi

          # Smoke exercises the CLI + MCP binary, so it only needs to run
          # when the binary or its core changed.
          if echo "$CHANGED" | grep -qE '^crates/(crabcc-cli|crabcc-core|crabcc-mcp)/'; then
            echo "smoke=1" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^scripts/(install-aliases|aliases-smoke)\.sh$'; then
            echo "aliases=1" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # PR: advisory. auto-fix-lint.yml runs `cargo fmt --all` proactively on
      # the PR, so a formatting nit never red-gates the build. Push-to-main
      # stays a hard gate so the trunk is always fmt-clean.
      - name: cargo fmt --all --check
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo fmt --all -- --check

  lint:
    name: lint (clippy)
    needs: scope
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # A docs-only PR still enters this job (aliases-smoke may need to run)
      # but has nothing to compile — skip the apt install and the cache
      # restore in that case.
      - uses: ./.github/actions/rust-deps
        if: needs.scope.outputs.crates != ''

      # rust-cache stores `~/.cargo` (registry index + cache + git deps) AND
      # `target/`, keyed off Cargo.lock + rustc + env-var hashes. Don't bolt
      # an extra `actions/cache` for `~/.cargo/registry/*` on top — the two
      # compete for the same paths and the same cache budget.
      - uses: Swatinem/rust-cache@v2
        if: needs.scope.outputs.crates != ''
        with:
          # Bump prefix-key (v1 → v2) to force-clear the cache when the
          # toolchain or profile set changes and a stale entry would
          # otherwise cause subtle cache-poisoning failures.
          prefix-key: "v1"
          # Distinct from the test job's key: clippy and nextest build with
          # different RUSTFLAGS, so a shared `target/` would thrash.
          shared-key: ci-lint
          cache-on-failure: "true"
          cache-all-crates: "true"

      # `--all-targets` covers lib + bins + tests + examples + benches;
      # binary-only crates (crabcc-cli) reject `--lib`.
      #
      # PR: advisory — warnings surface in the log and auto-fix-lint applies
      # the fixable subset. Push-to-main keeps `-D warnings` as a hard gate.
      - name: cargo clippy (scoped)
        if: needs.scope.outputs.crates != ''
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo clippy ${{ needs.scope.outputs.crates }} --all-targets -- -D warnings

      # Issue #81: shell-only smoke for scripts/install-aliases.sh.
      # Sub-second; asserts --aggressive verbs and idempotence.
      - name: aliases-smoke
        if: needs.scope.outputs.aliases == '1'
        run: bash scripts/aliases-smoke.sh

  test:
    name: test (ubuntu, scoped)
    needs: scope
    if: needs.scope.outputs.crates != ''
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1"
          shared-key: ci-ubuntu
          cache-on-failure: "true"
          cache-all-crates: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest (scoped)
        run: cargo nextest run ${{ needs.scope.outputs.crates }} --profile ci

      - name: upload test report (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-ubuntu
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

  # crabcc's primary consumers are coding agents talking to the MCP server
  # (and the HTTP/SDK surface behind it), not humans at a shell. The unit
  # tests cover dispatch in-process; this job is the only place the shipped
  # binary is driven end-to-end over the real stdio JSON-RPC transport, the
  # way Claude Code / opencode / entheai actually drive it.
  smoke:
    name: smoke (CLI + MCP stdio)
    needs: scope
    if: needs.scope.outputs.smoke == '1'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1"
          shared-key: ci-smoke
          cache-on-failure: "true"
          cache-all-crates: "true"

      - name: build crabcc
        run: cargo build -p crabcc-cli --profile ci

      # A git root is required: the MCP server resolves the index by walking
      # up to `.git` (find_git_root), so a bare temp dir silently yields an
      # empty result set instead of an error.
      - name: build fixture repo
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE=$(mktemp -d)
          cd "$FIXTURE"
          git init -q .
          cat > a.ts <<'EOF'
          export function hello(name: string) { return name; }
          export function greet() { return hello("world"); }
          EOF
          echo "dir=$FIXTURE" >> "$GITHUB_OUTPUT"

      - name: smoke — CLI (index + lookup sym + lookup callers)
        shell: bash
        working-directory: ${{ steps.fixture.outputs.dir }}
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/target/ci/crabcc"
          "$BIN" index
          "$BIN" lookup sym hello     | jq -e '.[0].name == "hello"'
          "$BIN" lookup callers hello --count | jq -e '.count >= 1'

      # Newline-delimited JSON-RPC 2.0 over stdio — the framing every MCP
      # client uses (see crates/crabcc-mcp/src/transport.rs). Asserts the
      # handshake, that tools are advertised, and that a tools/call returns
      # the same symbol the CLI just found. The CLI and MCP paths resolve
      # the store separately, so a green CLI smoke does not imply a green
      # MCP one — that divergence is exactly what this step guards.
      - name: smoke — MCP stdio (initialize + tools/list + tools/call)
        shell: bash
        working-directory: ${{ steps.fixture.outputs.dir }}
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/target/ci/crabcc"
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"sym","arguments":{"name":"hello"}}}' \
            | "$BIN" --mcp > out.jsonl

          cat out.jsonl

          jq -e 'select(.id == 1) | .result.serverInfo.name == "crabcc-mcp"'   out.jsonl
          jq -e 'select(.id == 2) | any(.result.tools[]; .name == "sym")'     out.jsonl
          # tools/call wraps the payload as MCP text content — parse the
          # inner JSON and assert the symbol actually came back.
          jq -e 'select(.id == 3) | (.result.content[0].text | fromjson | .[0].name == "hello")' out.jsonl
