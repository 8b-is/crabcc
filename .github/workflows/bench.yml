name: bench

# Criterion + divan benchmarks on a 16 vCPU / 64 GB Blacksmith runner.
#
# This used to be a three-job dance: provision an ephemeral OVHCloud
# instance via OpenStack, register it as a one-shot self-hosted runner,
# bench, then tear the instance down in an `if: always()` job so we didn't
# leak billing. That machinery (plus its five OVH_* secrets and the
# install/github-runner/ provisioning scripts, which no longer exist) is
# replaced by a single `runs-on:` line — Blacksmith boots the microVM in
# under 3s and bills only for the job.
#
# Blacksmith dedicates capacity per runner family, so timings are stable
# enough to compare across runs; still treat absolute numbers as
# machine-relative and compare like-for-like.

on:
  workflow_dispatch:
    inputs:
      crates:
        description: "Space-separated crate names to bench (empty = --workspace)"
        type: string
        default: ""

concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  bench:
    name: criterion (${{ inputs.crates || 'workspace' }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1"
          shared-key: bench
          cache-all-crates: "true"

      - name: cargo bench (criterion)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.crates }}" ]; then
            ARGS=""
            for c in ${{ inputs.crates }}; do ARGS="$ARGS -p $c"; done
          else
            ARGS="--workspace"
          fi
          # shellcheck disable=SC2086
          cargo bench $ARGS

      # divan benches (alloc profiling). Run after criterion so the
      # AllocProfiler global doesn't interfere with criterion's timing.
      # `--features bench` required for crabcc-core divan targets.
      - name: cargo bench (divan alloc)
        run: |
          cargo bench -p wormhole-node --bench alloc_profile
          cargo bench -p crabcc-core  --bench alloc_ops --features bench

      - name: upload criterion reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-${{ github.run_id }}
          path: target/criterion/
          if-no-files-found: warn
          retention-days: 30
